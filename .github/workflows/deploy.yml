name: Deploy to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-ec2-deploy
  cancel-in-progress: false

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/zebra-fe

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_KAKAO_MAP_KEY=${{ secrets.NEXT_PUBLIC_KAKAO_MAP_KEY }}
            NEXT_PUBLIC_USE_MOCK=false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.sha }}
      BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}

    steps:
      - name: Deploy via SSH (pull → restart container)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: IMAGE,SHA,BACKEND_API_URL
          script: |
            set -e

            docker pull $IMAGE:$SHA

            echo "BACKEND_API_URL=$BACKEND_API_URL" > /home/ubuntu/zebra/.env

            docker stop zebra-fe || true
            docker rm zebra-fe || true

            docker run -d \
              --name zebra-fe \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file /home/ubuntu/zebra/.env \
              $IMAGE:$SHA

            docker image prune -f

            # ⚠️ `docker run -d`는 컨테이너가 뜨기만 하면 성공이다 — 그 안의 Next.js가
            #    BACKEND_API_URL을 잘못 읽어 매 요청마다 실패해도 이 워크플로는 초록으로
            #    끝난다. 배포 뒤 상태를 여기서 직접 찍어서, AWS 콘솔 접근 없이 Actions 로그
            #    만으로 원인을 좁힐 수 있게 한다.
            echo "=== 배포 진단 ==="
            echo "BACKEND_API_URL(FE 컨테이너가 실제로 읽는 값): $BACKEND_API_URL"

            sleep 3

            echo "--- FE 컨테이너 응답 확인 (localhost:3000) ---"
            curl -m 5 -sS -o /dev/null -w "HTTP %{http_code}\n" http://localhost:3000 \
              || echo "FE 컨테이너가 응답하지 않습니다 — docker logs 확인 필요"

            echo "--- EC2에서 BE로 직접 도달 가능한지 확인 (BE actuator health) ---"
            curl -m 5 -sS -o /dev/null -w "HTTP %{http_code}\n" "$BACKEND_API_URL/actuator/health" \
              || echo "EC2에서 BE로 연결할 수 없습니다 — BACKEND_API_URL 오타이거나 BE가 안 떠 있거나 방화벽 차단"

            echo "--- FE 컨테이너 최근 로그 50줄 ---"
            docker logs --tail 50 zebra-fe
